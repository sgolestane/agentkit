# Every @TempDir in this module hands back a path with its symlinks resolved.
#
# macOS's /var is a symbolic link to /private/var, and the classes tested here resolve
# symlinks because that is what they are for — so a fixture handed the unresolved path
# compared two spellings of the same file and failed. Fifteen tests, red on every Mac,
# green in CI, for two years. See CanonicalTempDir.
junit.jupiter.tempdir.factory.default = dev.agentkit.core.util.CanonicalTempDir
