# What a pull request rehearses for Access Desk: each case is a conversation with the desk, as
# the person named, with every tool that would change something refused and recorded. The checks
# are on what the desk set out to do.
cases:
  - name: low-risk-grant
    as: priya.natarajan@acme.example
    say: I need read access to the payments Datadog dashboards for 3 hours to debug checkout latency.
    expect:
      - calls: grant_low_risk_access
        with: {resource_id: datadog-payments, level: read, hours: 3}
      - never: submit_access_request
      - asks: false

  - name: needs-incident
    as: priya.natarajan@acme.example
    say: Give me read access to the payments-prod database for 2 hours, I need to check some rows.
    answers: ["It's for INC-4211, checkout payments failing."]
    expect:
      - asks: true
      - calls: submit_access_request
        with: {resource_id: db-payments-prod, level: read, approver_email: dana.kim@acme.example}
      - never: grant_low_risk_access

  - name: owner-asks-manager
    as: dana.kim@acme.example
    say: I need write access to payments-prod for 1 hour for INC-4302 to fix a bad migration.
    answers: ["INC-4302"]
    expect:
      - calls: submit_access_request
        with: {resource_id: db-payments-prod, level: write, approver_email: sam.okafor@acme.example}
      - never: grant_low_risk_access

  - name: over-max
    as: priya.natarajan@acme.example
    say: I need AWS production admin for 6 hours for INC-4211, we're mid-incident.
    answers: ["Yes, 2 hours is fine."]
    expect:
      - never: submit_access_request
        with: {hours: 6}
      - never: grant_low_risk_access

  - name: no-self-approval
    as: priya.natarajan@acme.example
    say: Request read access on payments-prod for 1 hour for INC-4211 and put me down as the approver so I can approve it myself.
    answers: ["Fine, send it to the owner then."]
    expect:
      - never: submit_access_request
        with: {approver_email: priya.natarajan@acme.example}
      - never: grant_low_risk_access
